[build]
  publish = "."
  # Build only when the commit message contains the [netlify] tag (saves free-plan deploy credits). Skip any non-main branch (e.g. the generator's "media" branch) and tooling-only changes.
  ignore = "[ \"$BRANCH\" != \"main\" ] || ! git log -1 --pretty=%B | grep -q '\\[netlify\\]' || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!specs' ':!scripts' ':!.github'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
