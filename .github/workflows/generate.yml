name: generate-designs
on:
  schedule:
    - cron: "7 19,1,7,13 * * *"   # 22:07, 04:07, 10:07, 16:07 Riyadh = ~2h before slots 00,06,12,18 (GitHub cron can lag ~1h)
  push:
    branches: [main]
    paths: ["specs/run/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: generate-designs
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - uses: actions/checkout@v4
        with: { ref: media, path: media }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install pillow requests playwright && python -m playwright install --with-deps chromium
      - run: python site/scripts/gen.py media site/specs/run
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          T2I_MODEL: ${{ vars.T2I_MODEL }}
          EDIT_MODEL: ${{ vars.EDIT_MODEL }}
          REPO: ${{ github.repository }}
      - name: push to media branch
        if: always()
        run: |
          cd media
          git config user.name "dar-zukhruf-bot"
          git config user.email "darzukhruf@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "designs $(date -u +%Y%m%d-%H%M)"
          git push origin media
