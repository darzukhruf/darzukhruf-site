name: generate-designs
on:
  schedule:
    - cron: "7 */2 * * *"   # every 2h: generates any planned post due in the next 36h (flexible times chosen by the agents)
  push:
    branches: [main]
    paths: ["specs/run/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: generate-designs
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - uses: actions/checkout@v4
        with: { ref: media, path: media }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install deps (with retries and timeouts)
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg && break
            echo "apt attempt $i failed, retrying"; sleep 20
          done
          pip install pillow requests playwright
          timeout 600 python -m playwright install --with-deps chromium || timeout 600 python -m playwright install chromium
      - run: python site/scripts/gen.py media site/specs/run
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          T2I_MODEL: ${{ vars.T2I_MODEL }}
          EDIT_MODEL: ${{ vars.EDIT_MODEL }}
          REPO: ${{ github.repository }}
      - name: push to media branch
        if: always()
        run: |
          cd media
          git config user.name "dar-zukhruf-bot"
          git config user.email "darzukhruf@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "designs $(date -u +%Y%m%d-%H%M)"
          git push origin media
