name: site-health
# فحص يومي إن الموقع الحي يفتح وفورم الطلب موجود (البروكسي يمنع الوكلاء من فتحه). بلا أسرار وبلا صرف.
# قرار الـ CEO 26-11 (T-20261126-R1). النتيجة: نجاح/فشل التشغيل + ملخص الوظيفة. يملكه الـ CEO.
on:
  schedule:
    - cron: '17 3 * * *'   # 06:17 الرياض
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: check pages
        run: |
          fail=0
          check () { # url  must-contain
            code=$(curl -sL -o page.html -w '%{http_code}' --max-time 30 "$1" || echo 000)
            if [ "$code" = "200" ] && grep -q "$2" page.html; then r="OK"; else r="FAIL"; fail=1; fi
            echo "| $1 | $code | $r |" >> "$GITHUB_STEP_SUMMARY"
            echo "$r $code $1 | $(grep -o '<title>[^<]*' page.html | head -1) | $(grep -o '<form[^>]*>' page.html | head -1) | bytes=$(wc -c < page.html)"
          }
          echo "| الرابط | الكود | النتيجة |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          check "https://darzukhruf.netlify.app/" "request-form"
          check "https://darzukhruf.netlify.app/brief.html" "<form"
          check "https://darzukhruf.github.io/darzukhruf-site/sample.html" "زخرف"
          exit $fail
      - name: visit counters
        if: always()
        continue-on-error: true
        run: |
          # عدّاد زيارات github.io المجهول (assets/wa-src.js). القراءة فقط، بلا أسرار.
          C=https://abacus.jasoncameron.dev/get/darzukhruf
          echo "" >> "$GITHUB_STEP_SUMMARY"; echo "| العدّاد | القيمة |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          keys="all-views src-none src-pinterest src-tiktok src-instagram"
          for p in index $(curl -s --max-time 20 https://darzukhruf.github.io/darzukhruf-site/sitemap.xml | grep -o '<loc>[^<]*' | sed 's#.*/##; s#\.html$##'); do keys="$keys pg-$p wa-gh-$p"; done
          echo "HITTEST $(curl -s --max-time 10 https://abacus.jasoncameron.dev/hit/darzukhruf/ci-probe)"; sleep 2
          for k in $keys; do
            r=$(curl -s --max-time 10 "$C/$k"); v=$(echo "$r" | grep -o '"value":[0-9]*' | cut -d: -f2)
            if echo "$r" | grep -q 'Too many'; then sleep 4; r=$(curl -s --max-time 10 "$C/$k"); v=$(echo "$r" | grep -o '"value":[0-9]*' | cut -d: -f2); fi
            echo "COUNT $k=${v:-0}"; sleep 1.5
            [ -n "$v" ] && echo "| $k | $v |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "PROBE $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://abacus.jasoncameron.dev/info/darzukhruf/all-views)"
