name: indexnow
# يبلّغ Bing ومحركات IndexNow (Copilot، بحث ChatGPT، DuckDuckGo، Yandex) بروابط sitemap.xml بعد كل نشر على Pages.
# بلا أسرار وبلا صرف. المفتاح ملف عام بالتصميم (شرط IndexNow). قرار الـ CEO 22-11 (T-20261122-02/07/08).
on:
  push:
    branches: [main]
    paths: ['*.html', 'sitemap.xml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wait for Pages
        run: sleep 120
      - name: verify key file is live
        run: curl -sf "https://darzukhruf.github.io/darzukhruf-site/c1fac2ea8dc87d5a146ad57a6ba15aa4.txt" | grep -q "c1fac2ea8dc87d5a146ad57a6ba15aa4"
      - name: build body
        run: |
          python3 - <<'PY'
          import json, re
          locs = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          body = {"host": "darzukhruf.github.io", "key": "c1fac2ea8dc87d5a146ad57a6ba15aa4",
                  "keyLocation": "https://darzukhruf.github.io/darzukhruf-site/c1fac2ea8dc87d5a146ad57a6ba15aa4.txt",
                  "urlList": [u.strip() for u in locs if u.strip().startswith("https://darzukhruf.github.io/darzukhruf-site/")]}
          json.dump(body, open("body.json", "w"))
          print(len(body["urlList"]), "urls")
          PY
      - name: submit
        run: |
          code=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow HTTP $code"; cat resp.txt || true
          test "$code" = 200 -o "$code" = 202
